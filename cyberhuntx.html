<div class="card"><h2>Telemetry history</h2>${hist.map(h=>`<p class="mut">${fmt(h)} — heartbeat (simulated)</p>`).join("")}</div>`}
function reportsV(){const l=DB.cases.slice().sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt));return`<h1>Reports and history</h1><div class="card"><div class="wrap"><table><tr><th>Case</th><th>File</th><th>Verdict</th><th>Decided</th><th></th></tr>${l.map(c=>`<tr><td><code>${c.id}</code></td><td>${esc(c.fileName)}</td><td>${c.verdict?badge(c.verdict):badge(c.status)}</td><td>${c.decidedAt?fmt(c.decidedAt):"—"}</td><td><button class="btn" data-a="report" data-id="${c.id}">Open report</button></td></tr>`).join("")}</table></div></div>`}
function view(){switch(S.view){case"dash":return dashV();case"submit":return submitV();case"cases":return listV();case"notes":return notesV();case"overview":return overviewV();case"queue":return queueV();case"case":return caseV();case"endpoints":return epsV();case"ep":return epV();case"reports":return reportsV()}return""}
function labelTables(root=document){root.querySelectorAll(".wrap table").forEach(table=>{const heads=[...table.querySelectorAll("tr:first-child th")].map(th=>th.textContent.trim());table.querySelectorAll("tr:not(:first-child)").forEach(row=>[...row.children].forEach((cell,i)=>{if(cell.tagName==="TD")cell.dataset.label=heads[i]||""}));const wrap=table.closest(".wrap");if(wrap){wrap.setAttribute("role","region");wrap.setAttribute("tabindex","0");wrap.setAttribute("aria-label","Scrollable data table; on small screens rows are presented as labelled cards")}})}
function render(){$("#app").innerHTML=S.user?shell(view()):loginV();if(S.view==="submit")bindUp();labelTables();
 document.querySelectorAll("tr.k").forEach(row=>{row.setAttribute("tabindex","0");row.setAttribute("role","button");row.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();row.click()}})})}

/* ---------- report ---------- */
function showReport(id){const c=DB.cases.find(x=>x.id===id),notes=DB.cn.filter(n=>n.cid===id),au=DB.audit.filter(a=>a.cid===id);
const a=c.analysis;$("#rep").hidden=false;$("#rep").innerHTML=`<div class="card"><div class="row np"><button class="btn p" data-a="print">Print / Save as PDF</button><button class="btn" data-a="copyjson" data-id="${id}">Copy JSON</button><button class="btn" data-a="closerep">Close</button></div>
<h1>CyberHuntX investigation report — ${c.id}</h1><div class="sim">DEMONSTRATION REPORT — analysis findings and AI explanation are simulated, not a real scan.</div>
<p><b>File:</b> ${esc(c.fileName)} (${(c.size/1024).toFixed(0)} KB)<br><b>SHA-256:</b> <code>${c.sha256}</code><br><b>Submitted:</b> ${fmt(c.submittedAt)} by ${esc(uname(c.by))}<br><b>Status:</b> ${c.status}</p>
<p><b>Verdict:</b> ${c.verdict||"Not yet decided"} ${c.decidedAt?"("+fmt(c.decidedAt)+" by "+esc(uname(c.decidedBy))+")":""}<br>${esc(c.decision)}</p>
<h2>Findings (simulated)</h2><p>Risk: ${a.risk} · ${a.arch}</p><ul>${a.ind.map(i=>`<li>${esc(i)}</li>`).join("")}</ul><p>YARA: ${a.yara.join(", ")||"none"}</p><p>Peak entropy: ${Math.max(...a.secs.map(s=>s[1])).toFixed(1)}</p>
<h2>AI-assisted explanation (mock)</h2><p>${a.ai.sum} ${a.ai.exp}</p><h2>Notes</h2>${notes.map(n=>`<p>${fmt(n.at)} ${esc(uname(n.by))}: ${esc(n.text)}</p>`).join("")||"<p>None.</p>"}
<h2>Administrator actions</h2>${au.map(x=>`<p>${fmt(x.at)} — ${esc(uname(x.actor))}: ${esc(x.text)}</p>`).join("")}<p class="mut">A Safe verdict does not guarantee a file is harmless.</p></div>`}

/* ---------- upload ---------- */
function bindUp(){const d=$("#drop"),fi=$("#fi");if(!d)return;d.ondragover=e=>{e.preventDefault();d.classList.add("hv")};d.ondragleave=()=>d.classList.remove("hv");d.ondrop=e=>{e.preventDefault();d.classList.remove("hv");if(e.dataTransfer.files[0])doSubmit(e.dataTransfer.files[0])};fi.onchange=()=>fi.files[0]&&doSubmit(fi.files[0])}
async function doSubmit(f){const er=$("#uerr");er.textContent="";
if(!/\.(exe|dll|sys|scr)$/i.test(f.name))return er.textContent="Unsupported type. Allowed: .exe, .dll, .sys, .scr";
if(f.size===0)return er.textContent="The file is empty.";if(f.size>10*1048576)return er.textContent="File exceeds the 10 MB limit.";
$("#up").hidden=false;const pb=$("#pb"),pt=$("#pt");pt.textContent="Reading file (never executed)…";pb.style.width="20%";
let h="unavailable",hashComputed=false;try{if(!globalThis.crypto?.subtle)throw new Error("Web Crypto unavailable");h=[...new Uint8Array(await crypto.subtle.digest("SHA-256",await f.arrayBuffer()))].map(b=>b.toString(16).padStart(2,"0")).join("");hashComputed=true}catch(e){}
pb.style.width="60%";await sleep(500);pt.textContent=hashComputed?"Hash computed. Queuing simulated analysis…":"Hash unavailable. Queuing simulated analysis…";pb.style.width="90%";await sleep(500);
const p=["low","mid","high"][parseInt(h.slice(0,2),16)%3||0]||"mid";const n=DB.cases.length+1;
const c={id:"CHX-2026-"+String(n).padStart(4,"0"),fileName:f.name.replace(/[^\w.\- ]/g,"_"),size:f.size,sha256:h,by:S.user.id,submittedAt:now(),status:"Analyzing",verdict:null,decision:"",decidedBy:null,decidedAt:null,analysis:JSON.parse(JSON.stringify(PROF[p])),real:true,hashComputed};
DB.cases.push(c);audit(c.id,S.user.id,"Submitted "+c.fileName);save();toast("Submitted as "+c.id+". Simulated analysis running…");go("case",c.id);runAnalysis(c.id)}

/* ---------- events ---------- */
document.addEventListener("click",e=>{if(e.target.id==="rep"){$("#rep").hidden=true;return}const t=e.target.closest("[data-a]");if(!t)return;if(t.tagName==="A")e.preventDefault();const d=t.dataset;
switch(d.a){
case"login":S.user=USERS.find(u=>u.id===d.r);S.view=S.user.role==="admin"?"overview":"dash";render();break;
case"theme":setTheme(isDark()?"light":"dark");render();break;case"switch":S.user=USERS.find(u=>u.id===(S.user.role==="admin"?"u-emp":"u-adm"));S.view=S.user.role==="admin"?"overview":"dash";S.id=null;render();break;case"iso":{const x=DB.eps.find(y=>y.id===d.id);x.sec="At risk";x.ev.unshift("Network isolation requested (simulated)");audit("EP",S.user.id,"Isolated "+x.host+" (simulated)");save();render();toast(x.host+" isolated (simulated)");break}case"logout":S.user=null;S.view="login";render();break;
case"go":if(d.v==="case"&&S.user.role==="admin"){const c=DB.cases.find(x=>x.id===d.id);if(c&&c.status==="Pending Review"){c.status="Under Review";audit(c.id,S.user.id,"Opened case; status set to Under Review");save()}}go(d.v,d.id);break;
case"pg":S.page+=+d.d;$("#tbl").innerHTML=qTable();labelTables($("#tbl"));break;
case"note":{const v=$("#nt").value.trim();if(!v)return toast("Write a note first");DB.cn.push({id:uid(),cid:d.id,by:S.user.id,text:v,at:now()});audit(d.id,S.user.id,"Added investigation note");save();render();toast("Note added");break}
case"decide":{const c=DB.cases.find(x=>x.id===d.id),r=document.querySelector("input[name=vd]:checked"),ex=$("#ex").value.trim();
if(!r)return $("#derr").textContent="Choose a verdict.";if(ex.length<10)return $("#derr").textContent="Add an explanation of at least 10 characters.";
Object.assign(c,{verdict:r.value,decision:ex,decidedBy:S.user.id,decidedAt:now(),status:"Resolved"});audit(c.id,S.user.id,"Recorded decision: "+r.value);notify(c.by,c.id,"Case "+c.id+" resolved: "+r.value);save();render();toast("Decision recorded; employee notified");break}
case"escalate":{const c=DB.cases.find(x=>x.id===d.id);c.status="Escalated";audit(c.id,S.user.id,"Escalated for further investigation");notify(c.by,c.id,"Case "+c.id+" escalated for further investigation");save();render();toast("Case escalated");break}
case"report":showReport(d.id);break;case"closerep":$("#rep").hidden=true;break;case"print":print();break;
case"copyjson":{const c=DB.cases.find(x=>x.id===d.id);const j=JSON.stringify({case:c,notes:DB.cn.filter(n=>n.cid===d.id),audit:DB.audit.filter(a=>a.cid===d.id),simulated:true},null,2);(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>toast("JSON copied"),()=>toast("Clipboard unavailable"));break}
case"hb":{DB.eps.find(x=>x.id===d.id).hb=now();save();render();toast("Simulated heartbeat received");break}
case"reset":if(confirm("Reset all demo data to the seeded state?")){DB=seed();save();go("overview");toast("Demo data reset")}break}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#rep").hidden){$("#rep").hidden=true}});
document.addEventListener("input",e=>{const f=e.target.dataset&&e.target.dataset.f;if(!f)return;S[f]=e.target.value;S.page=1;const tb=$("#tbl");if(tb){tb.innerHTML=S.view==="queue"?qTable():epTable();labelTables(tb)}});
/* ---------- theme, live feed, async analysis ---------- */
try{const t=localStorage.getItem("chx_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("chx_theme",t)}catch(e){}}
const rel=t=>{const s=Math.max(0,(Date.now()-new Date(t))/1e3);return s<60?Math.floor(s)+"s ago":s<3600?Math.floor(s/60)+"m ago":s<86400?Math.floor(s/3600)+"h ago":fmt(t)};
const typing=()=>/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"");
const POOL=[["HIGH","Unsigned binary executed on DEV-WS-021"],["MED","USB storage mounted on HR-DT-007"],["INFO","Definition update installed on FIN-LT-014"],["INFO","Policy sync complete on OPS-SRV-002"],["MED","Outbound connection to rare domain from SALES-LT-033"],["INFO","Heartbeat received from FIN-LT-014"],["LOW","Failed login burst cleared on HR-DT-007"]];
const FEED=[];let lastU=null,lastUn=0;
function pushFeed(){const p=POOL[Math.floor(Math.random()*POOL.length)];FEED.unshift({at:now(),lv:p[0],text:p[1]});if(FEED.length>8)FEED.pop()}
function feedHTML(){return FEED.map(f=>`<div class="fe">${badge(f.lv==="HIGH"?"High":f.lv==="MED"?"Medium":"Low")} ${esc(f.text)} <span class="mut">· ${rel(f.at)}</span></div>`).join("")+'<p class="mut" style="font-size:12px;margin:8px 0 0">Simulated events for demonstration.</p>'}
function weekChart(){const d=[...Array(7)].map((_,i)=>{const t=new Date(Date.now()-(6-i)*864e5);return[t.toLocaleDateString([],{weekday:"short"}),DB.cases.filter(c=>new Date(c.submittedAt).toDateString()===t.toDateString()).length]}),m=Math.max(1,...d.map(x=>x[1]));return`<div class="chart">${d.map(x=>`<div><i style="height:${x[1]/m*70}%"></i><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div>`}
function runAnalysis(id,ms=6000){setTimeout(()=>{const c=DB.cases.find(x=>x.id===id);if(!c||c.status!=="Analyzing")return;c.status="Pending Review";audit(id,"u-adm","Simulated analysis completed (demo)");notify("admin",id,"Analysis complete, ready for review: "+id);notify(c.by,id,"Analysis complete for "+id+". Awaiting analyst review.");save();if(S.user&&!typing())render()},ms)}
function tick(){["EP-1001","EP-1002","EP-1005"].forEach(id=>{const e=DB.eps.find(x=>x.id===id);if(e)e.hb=now()});pushFeed();if(!S.user)return;
const un=myNotes().filter(n=>!n.read).length;
if(lastU!==S.user.id){lastU=S.user.id;lastUn=un}else if(un!==lastUn){if(un>lastUn)toast("🔔 New notification");lastUn=un;if(!typing())render();return}
const tb=$("#tbl"),lv=$("#live");if(S.view==="endpoints"&&tb&&!typing()){tb.innerHTML=epTable();labelTables(tb)}if(S.view==="overview"&&lv)lv.innerHTML=feedHTML();if(S.view==="ep"&&!typing())render()}
DB.cases.filter(c=>c.status==="Analyzing").forEach(c=>runAnalysis(c.id,1500));for(let i=0;i<5;i++)pushFeed();setInterval(tick,4000);
render();
</script></body></html>
