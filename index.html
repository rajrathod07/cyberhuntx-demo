<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f7fb" />
  <title>CyberHuntX | Defensive Triage Console</title>
  <style>
    :root {
      --bg: #0a1020;
      --panel: #101a2d;
      --panel2: #142139;
      --line: #263550;
      --text: #e8eef9;
      --muted: #91a2bd;
      --blue: #6e9cff;
      --cyan: #61ded0;
      --purple: #aa8cff;
      --green: #4dd4a6;
      --amber: #f5bd66;
      --red: #ff7185;
      --shadow: 0 18px 50px rgba(0, 0, 0, .23)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 70% -10%, #17264a 0, #0a1020 40%);
      color: var(--text);
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 248px 1fr
    }

    .sidebar {
      background: rgba(9, 15, 29, .88);
      border-right: 1px solid var(--line);
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      gap: 24px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 9px
    }

    .brandmark {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: linear-gradient(135deg, #73a0ff, #7c69e8);
      display: grid;
      place-items: center;
      color: white;
      font-size: 21px;
      box-shadow: 0 8px 25px #5e7ff033
    }

    .brand strong {
      display: block;
      font-size: 16px;
      letter-spacing: .2px
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1.6px;
      text-transform: uppercase
    }

    .navlabel {
      font-size: 10px;
      letter-spacing: 1.7px;
      color: #71829d;
      text-transform: uppercase;
      padding: 0 12px;
      margin-bottom: 7px
    }

    .nav {
      display: grid;
      gap: 5px
    }

    .nav button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid transparent;
      background: transparent;
      color: #9eacc4;
      border-radius: 11px;
      text-align: left;
      transition: .18s
    }

    .nav button:hover {
      background: #15223a;
      color: #eaf1ff
    }

    .nav button.active {
      background: linear-gradient(100deg, #26385c, #192943);
      border-color: #334c76;
      color: #fff
    }

    .nav .ico {
      font-size: 17px;
      width: 20px;
      text-align: center
    }

    .nav .count {
      margin-left: auto;
      border-radius: 8px;
      background: #763b50;
      color: #ffd5dc;
      font-size: 11px;
      padding: 1px 7px
    }

    .sidebottom {
      margin-top: auto
    }

    .safetybox {
      padding: 13px;
      border: 1px solid #284b55;
      border-radius: 13px;
      background: #10242d
    }

    .safetybox .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      margin-right: 7px
    }

    .safetybox strong {
      font-size: 12px
    }

    .safetybox p {
      color: var(--muted);
      font-size: 11px;
      margin: 7px 0 0
    }

    .main {
      min-width: 0
    }

    .topbar {
      height: 76px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      background: #0b1322b8;
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 4
    }

    .crumb {
      color: var(--muted);
      font-size: 12px
    }

    .topright {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .role-switch {
      display: flex;
      background: #111e32;
      border: 1px solid var(--line);
      padding: 4px;
      border-radius: 11px;
      gap: 3px
    }

    .role-switch button {
      color: #aab8ce;
      background: transparent;
      border: 0;
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 12px
    }

    .role-switch button.active {
      color: #fff;
      background: #2b426b
    }

    .iconbtn,
    .btn {
      border: 1px solid var(--line);
      background: #152238;
      color: #e9f0ff;
      border-radius: 10px;
      padding: 9px 12px
    }

    .iconbtn {
      width: 38px;
      height: 38px;
      padding: 0;
      font-size: 16px;
      position: relative
    }

    .btn:hover,
    .iconbtn:hover {
      border-color: #5574a7;
      background: #1b2c49
    }

    .btn.primary {
      background: linear-gradient(110deg, #487bea, #7066db);
      border: 0;
      color: white;
      box-shadow: 0 7px 18px #526de533
    }

    .btn.primary:hover {
      filter: brightness(1.1)
    }

    .btn.ghost {
      background: transparent
    }

    .btn.danger {
      color: #ffb1bc;
      border-color: #633847;
      background: #2b1c2a
    }

    .btn.small {
      font-size: 12px;
      padding: 6px 9px;
      border-radius: 8px
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: #263d61;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 12px
    }

    .user {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-left: 5px
    }

    .user strong {
      display: block;
      font-size: 12px
    }

    .user small {
      display: block;
      color: var(--muted);
      font-size: 10px
    }

    .content {
      padding: 28px 30px 42px;
      max-width: 1600px;
      margin: auto
    }

    .pagehead {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
      margin-bottom: 23px
    }

    .eyebrow {
      font-size: 10px;
      color: var(--cyan);
      letter-spacing: 1.8px;
      text-transform: uppercase;
      font-weight: 700
    }

    .pagehead h1 {
      margin: 5px 0 5px;
      font-size: 27px;
      letter-spacing: -.7px
    }

    .pagehead p {
      color: var(--muted);
      margin: 0;
      max-width: 650px
    }

    .headactions {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .demo-banner {
      border: 1px solid #5a4b2b;
      background: linear-gradient(100deg, #302715aa, #1b2031aa);
      padding: 11px 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      color: #f4d79d;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 12px
    }

    .demo-banner strong {
      color: #ffe9b9
    }

    .grid {
      display: grid;
      gap: 15px
    }

    .stats {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 18px
    }

    .card {
      background: linear-gradient(140deg, #121e32, #101a2b);
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: var(--shadow);
      min-width: 0
    }

    .stat {
      padding: 17px 18px;
      position: relative;
      overflow: hidden
    }

    .stat:after {
      content: "";
      position: absolute;
      width: 95px;
      height: 95px;
      border-radius: 50%;
      background: var(--glow, #709aff);
      opacity: .07;
      right: -24px;
      top: -29px
    }

    .stathead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px
    }

    .staticon {
      font-size: 18px;
      color: var(--accent, var(--blue))
    }

    .statnum {
      font-size: 29px;
      font-weight: 750;
      letter-spacing: -1px;
      margin-top: 14px
    }

    .statfoot {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px
    }

    .statfoot .positive {
      color: var(--green)
    }

    .split {
      grid-template-columns: minmax(0, 1.6fr) minmax(290px, 1fr);
      margin-bottom: 18px
    }

    .cardhead {
      padding: 17px 19px;
      border-bottom: 1px solid #26344b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px
    }

    .cardhead h2 {
      font-size: 14px;
      margin: 0
    }

    .cardhead p {
      font-size: 11px;
      color: var(--muted);
      margin: 4px 0 0
    }

    .cardbody {
      padding: 17px 19px
    }

    .linkbtn {
      background: transparent;
      border: 0;
      color: #8caeff;
      font-size: 12px;
      padding: 4px
    }

    .chart {
      height: 174px;
      display: flex;
      align-items: end;
      gap: 11px;
      padding: 8px 5px 0
    }

    .baritem {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: end;
      align-items: center;
      gap: 8px;
      min-width: 0
    }

    .bars {
      height: 137px;
      width: 100%;
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 4px;
      border-bottom: 1px solid #293a54
    }

    .bar {
      width: 27%;
      max-width: 19px;
      border-radius: 5px 5px 1px 1px;
      background: linear-gradient(180deg, #6ba4ff, #4c60bd);
      min-height: 5px
    }

    .bar.alt {
      background: linear-gradient(180deg, #5ee1d0, #238d9f)
    }

    .barlabel {
      font-size: 10px;
      color: #8598b6
    }

    .legend {
      display: flex;
      gap: 14px;
      font-size: 10px;
      color: var(--muted);
      margin-top: 15px
    }

    .legend span:before {
      content: "";
      width: 7px;
      height: 7px;
      display: inline-block;
      background: #6ba4ff;
      border-radius: 2px;
      margin-right: 5px
    }

    .legend .l2:before {
      background: #5ee1d0
    }

    .statusline {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 13px 0
    }

    .statuscircle {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: #172e3b;
      color: var(--green);
      flex-shrink: 0
    }

    .statusline strong {
      font-size: 12px;
      display: block
    }

    .statusline small {
      font-size: 10px;
      color: var(--muted)
    }

    .statusright {
      margin-left: auto;
      font-size: 11px;
      color: var(--green)
    }

    .divider {
      height: 1px;
      background: #25344b;
      margin: 14px 0
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .field,
    .select,
    .textarea {
      background: #0d1728;
      color: var(--text);
      border: 1px solid #2a3b55;
      border-radius: 9px;
      padding: 10px 11px;
      outline: none;
      min-width: 0
    }

    .field:focus,
    .select:focus,
    .textarea:focus {
      border-color: #719bff;
      box-shadow: 0 0 0 3px #719bff20
    }

    .field.search {
      width: min(270px, 100%)
    }

    .select {
      padding: 9px 11px
    }

    .tablewrap {
      overflow: auto
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 760px
    }

    th {
      font-size: 10px;
      letter-spacing: .65px;
      text-transform: uppercase;
      color: #8495b1;
      text-align: left;
      font-weight: 650;
      background: #101a2b
    }

    th,
    td {
      padding: 13px 15px;
      border-bottom: 1px solid #243149
    }

    td {
      font-size: 12px;
      color: #d7e1f2
    }

    tr:last-child td {
      border-bottom: 0
    }

    tbody tr:hover {
      background: #18264066
    }

    .filecell {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 180px
    }

    .fileicon {
      width: 34px;
      height: 36px;
      background: #1d2e4b;
      border: 1px solid #314868;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #8bb5ff;
      font-size: 11px;
      font-weight: 800
    }

    .filecell strong {
      display: block;
      font-size: 12px
    }

    .filecell small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 2px
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid transparent
    }

    .pill:before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor
    }

    .pill.safe {
      background: #10332e;
      border-color: #225a4f;
      color: #71e1bd
    }

    .pill.suspicious {
      background: #392c1c;
      border-color: #68502b;
      color: #f6c16f
    }

    .pill.malicious {
      background: #3d202d;
      border-color: #704050;
      color: #ff8ca2
    }

    .pill.pending {
      background: #1b2d48;
      border-color: #334d72;
      color: #9fc0ff
    }

    .pill.analysis {
      background: #2b2145;
      border-color: #49396e;
      color: #c2a7ff
    }

    .pill.resolved {
      background: #15332e;
      border-color: #27574c;
      color: #7cdbbc
    }

    .rowactions {
      display: flex;
      gap: 5px
    }

    .tablefoot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 11px;
      padding: 12px 16px;
      border-top: 1px solid #243149
    }

    .quickgrid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-bottom: 18px
    }

    .quick {
      padding: 17px;
      display: flex;
      gap: 13px;
      align-items: center;
      text-align: left;
      color: var(--text);
      width: 100%;
      background: linear-gradient(140deg, #121e32, #101a2b);
      border: 1px solid var(--line);
      border-radius: 14px
    }

    .quick:hover {
      border-color: #5476aa;
      transform: translateY(-1px)
    }

    .quickico {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #1d3050;
      color: #96b8ff;
      font-size: 18px
    }

    .quick strong {
      display: block;
      font-size: 12px
    }

    .quick small {
      color: var(--muted);
      font-size: 10px
    }

    .endpointgrid {
      grid-template-columns: repeat(3, minmax(0, 1fr))
    }

    .endpoint {
      padding: 18px
    }

    .ephead {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .epicon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #1c2d48;
      font-size: 18px
    }

    .ephead strong {
      display: block;
      font-size: 13px
    }

    .ephead small {
      color: var(--muted);
      font-size: 10px
    }

    .epstate {
      margin-left: auto
    }

    .epmeta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 17px 0
    }

    .epmeta span {
      display: block;
      color: var(--muted);
      font-size: 10px
    }

    .epmeta strong {
      display: block;
      font-size: 12px;
      margin-top: 3px
    }

    .epfoot {
      border-top: 1px solid #26344b;
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 10px
    }

    .empty {
      padding: 38px 15px;
      text-align: center;
      color: var(--muted)
    }

    .empty strong {
      display: block;
      color: #dbe7f9;
      margin: 8px
    }

    .modalback {
      position: fixed;
      inset: 0;
      background: #050912cc;
      backdrop-filter: blur(6px);
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding:
        18px
    }

    .modalback.open {
      display: flex
    }

    .modal {
      width: min(720px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #111d31;
      border: 1px solid #344968;
      border-radius: 18px;
      box-shadow: 0 30px 90px #0009
    }

    .modalhead {
      padding: 18px 21px;
      border-bottom: 1px solid #2a3b54;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .modalhead h2 {
      font-size: 17px;
      margin: 0
    }

    .modalbody {
      padding: 20px
    }

    .modalfoot {
      padding: 15px 20px;
      border-top: 1px solid #2a3b54;
      display: flex;
      justify-content: flex-end;
      gap: 8px
    }

    .close {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 22px
    }

    .formgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px
    }

    .formgroup {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .formgroup label {
      font-size: 11px;
      color: #a8b8d0
    }

    .formgroup .field,
    .formgroup .select,
    .formgroup .textarea {
      width: 100%
    }

    .formgroup.full {
      grid-column: 1/-1
    }

    .textarea {
      resize: vertical;
      min-height: 90px
    }

    .detailgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px
    }

    .detailitem {
      border: 1px solid #2a3a53;
      background: #0d1727;
      border-radius: 10px;
      padding: 12px
    }

    .detailitem span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 4px
    }

    .detailitem strong {
      font-size: 12px;
      overflow-wrap: anywhere
    }

    .subheading {
      font-size: 12px;
      margin: 16px 0 8px
    }

    .finding {
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #2a3a53;
      background: #0e1829;
      margin-bottom: 7px;
      font-size: 12px
    }

    .finding strong {
      display: block;
      margin-bottom: 3px
    }

    .finding small {
      color: var(--muted);
      font-size: 11px
    }

    .toaststack {
      position: fixed;
      right: 18px;
      top: 86px;
      display: grid;
      gap: 8px;
      z-index: 30
    }

    .toast {
      background: #172840;
      border: 1px solid #35577e;
      color: #edf4ff;
      border-radius: 11px;
      padding: 12px 15px;
      box-shadow: var(--shadow);
      min-width: 240px;
      animation: in .2s ease
    }

    .toast small {
      display: block;
      color: #aec0da;
      margin-top: 2px
    }

    @keyframes in {
      from {
        opacity: 0;
        transform: translateY(-7px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .dropzone {
      border: 1px dashed #5275a6;
      border-radius: 13px;
      padding: 26px 16px;
      text-align: center;
      background: #101d31
    }

    .dropzone.drag {
      background: #1b3153;
      border-color: #91b7ff
    }

    .dropzone .upico {
      font-size: 27px;
      color: #8fb5ff
    }

    .dropzone strong {
      display: block;
      font-size: 13px;
      margin-top: 6px
    }

    .dropzone p {
      font-size: 11px;
      color: var(--muted);
      margin: 5px 0 13px
    }

    .footnote {
      font-size: 10px;
      color: #8394b0;
      margin-top: 14px
    }

    .notice {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #5a4b2b;
      background: #30271566;
      color: #f1d9a5;
      font-size: 11px
    }

    .hide {
      display: none !important
    }

    .mobilemenu {
      display: none
    }

    @media(max-width:1100px) {
      .app {
        grid-template-columns: 210px 1fr
      }

      .content {
        padding: 23px 20px
      }

      .topbar {
        padding: 0 20px
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      .split {
        grid-template-columns: 1fr
      }

      .endpointgrid {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    @media(max-width:760px) {
      .app {
        grid-template-columns: 1fr
      }

      .sidebar {
        position: fixed;
        z-index: 8;
        inset: 0 auto 0 0;
        width: 248px;

      async function createCase() { if (!pendingFile) { toast('Select an EXE first', 'Use a harmless test file for the demo.'); return } const f = pendingFile; let hash = ''; try { if (f.size <= 25 * 1024 * 1024 && crypto?.subtle) { const buf = await f.arrayBuffer(); const digest = await crypto.subtle.digest('SHA-256', buf); hash = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('') } } catch { } const id = 'CHX-' + new Date().getFullYear() + '-' + String(Math.max(1043, ...state.cases.map(c => Number(c.id.split('-').pop()) + 1))).padStart(4, '0'); const reason = ($('uploadReason')?.value || '').trim(); const c = { id, file: f.name, size: f.size, employee: 'Aarav Shah', email: 'aarav.shah@example.test', submitted: new Date().toISOString(), status: 'Pending review', verdict: 'Pending', sha256: hash, source: 'User-selected file metadata only', reason, notes: [], analysis: { mode: 'SIMULATED', pe: 'Not analysed in demo mode', arch: 'Not determined', entropy: null, imports: [], yara: [], summary: 'No actual static analysis was performed. The demo record is awaiting administrator review. Connect the FastAPI analysis service to obtain genuine findings.', findings: [['Analysis status', 'The file was submitted to the demonstration workflow.', 'No PE parsing, entropy calculation, disassembly or YARA scan has been run.']] }, events: [{ time: new Date().toISOString(), text: 'Submitted through single-file demonstration UI' }] }; state.cases.unshift(c); notify('New case submitted', id + ' · ' + f.name); audit('File metadata submitted', id, 'Demo record created; file bytes were not uploaded or retained. ' + (reason ? 'Reason: ' + reason : '')); save(); closeModal(); page = 'cases'; state.role = 'employee'; render(); toast('Demo case created', id + ' is now visible to the administrator.'); }
      function notificationsModal() { state.notifications.forEach(n => n.read = true); save(); const body = state.notifications.length ? state.notifications.map(n => `<div class="finding"><strong>${esc(n.title)}</strong>${esc(n.detail)}<small style="display:block;margin-top:4px">${fmtDate(n.time)}</small></div>`).join('') : '<div class="empty">No notifications yet.</div>'; openModal('Notifications', body, [{ label: 'Mark all read & close', action: 'close' }]); render() }
      function resetDemo() { if (!confirm('Reset all CyberHuntX demo changes in this browser and restore the original sample data?')) return; const oldRole = state.role; state = initial(); state.role = oldRole; assistantCaseId = null; save(); page = 'overview'; query = ''; statusFilter = 'All statuses'; closeModal(); render(); toast('Demo reset complete', 'Seed data restored.') }
      // navigation and general actions
      document.addEventListener('click', e => {
        const nav = e.target.closest('[data-page]'); if (nav) { setPage(nav.dataset.page); return }
        const role = e.target.closest('[data-role]'); if (role) { state.role = role.dataset.role; save(); page = 'overview'; query = ''; render(); toast('Demo role changed', state.role === 'admin' ? 'Admin SOC view enabled.' : 'Employee portal view enabled.'); return }
        const aiPrompt = e.target.closest('[data-ai-prompt]'); if (aiPrompt) { askAssistant(aiPrompt.dataset.aiPrompt); return }
        const clearAi = e.target.closest('#aiClearChat'); if (clearAi) { if (assistantCaseId) delete state.aiChats[assistantCaseId]; save(); render(); toast('Conversation cleared', 'Case data and investigation records were unchanged.'); return }
        const cbtn = e.target.closest('[data-open-case]'); if (cbtn) { caseDetail(cbtn.dataset.openCase); return }
        const ebtn = e.target.closest('[data-open-endpoint]'); if (ebtn) { openEndpoint(ebtn.dataset.openEndpoint); return }
        const rbtn = e.target.closest('[data-report]'); if (rbtn) { showReport(rbtn.dataset.report); return }
        const ma = e.target.closest('[data-modal-action]'); if (ma) { const action = ma.dataset.modalAction; switch (action) { case 'close': closeModal(); render(); break; case 'ask-ai': { const id = selectedCase; assistantCaseId = id; closeModal(); page = 'ai'; render(); break } case 'back-detail': { const id = selectedCase; caseDetail(id); break } case 'note': noteForm(); break; case 'decision': decisionForm(); break; case 'save-note': { const txt = ($('noteText')?.value || '').trim(); if (!txt) return toast('Note is required'); const c = state.cases.find(x => x.id === selectedCase); if (!c) return; c.notes = c.notes || []; c.notes.unshift({ author: 'SOC Administrator', text: txt, time: new Date().toISOString() }); audit('Investigation note added', c.id, txt); save(); caseDetail(c.id); toast('Investigation note saved'); break } case 'save-decision': { const c = state.cases.find(x => x.id === selectedCase); const verdict = $('decisionVerdict')?.value, status = $('decisionStatus')?.value, txt = ($('decisionText')?.value || '').trim(); if (!txt) return toast('Add a decision explanation', 'A recorded decision must include context.'); c.verdict = verdict; c.status = status; c.notes = c.notes || []; c.notes.unshift({ author: 'SOC Administrator', text: 'Decision: ' + verdict + '. ' + txt, time: new Date().toISOString() }); c.events = c.events || []; c.events.unshift({ time: new Date().toISOString(), text: 'Administrator recorded ' + verdict + ' decision' }); notify('Case decision recorded', c.id + ' · ' + verdict); audit('Administrator decision recorded', c.id, verdict + ' / ' + status + ' — ' + txt); save(); caseDetail(c.id); toast('Decision recorded', c.id + ' updated across the demo.'); break } case 'report': showReport(selectedCase); break; case 'create-case': createCase(); break; }return }
        if (e.target.closest('#uploadMain') || e.target.closest('#uploadTop') || e.target.closest('#uploadEmpty') || e.target.closest('#quickUpload')) { uploadModal(); return }
        if (e.target.closest('#chooseFile')) { $('modalFile').click(); return }
        if (e.target.closest('#prevPage')) { casePage = Math.max(1, casePage - 1); render(); return } if (e.target.closest('#nextPage')) { casePage++; render(); return }
        if (e.target.closest('#clearFilters')) { query = ''; statusFilter = 'All statuses'; casePage = 1; render(); return }
        if (e.target.closest('#exportCases')) { exportCases(); return }
        if (e.target.closest('#exportAllJson')) { downloadText('cyberhuntx-demo-cases.json', JSON.stringify(cases().filter(c => state.role !== 'employee' || c.employee === 'Aarav Shah'), null, 2), 'application/json'); toast('JSON exported', 'Demo case data downloaded.'); return }
        if (e.target.closest('#exportAudit')) { downloadText('cyberhuntx-audit.json', JSON.stringify(state.audit, null, 2), 'application/json'); toast('Audit log exported'); return }
        if (e.target.closest('#resetDemo')) { resetDemo(); return }
        if (e.target.closest('#notifyBtn')) { notificationsModal(); return }
        if (e.target.closest('#simulateHeartbeat')) { const e = state.endpoints.find(x => x.state === 'Stale') || state.endpoints[0]; e.state = 'Online'; e.heartbeat = new Date().toISOString(); audit('Simulated endpoint heartbeat', e.id, 'Demo heartbeat generated locally.'); save(); render(); toast('Demo heartbeat updated', e.host + ' now shows Online.'); return }
        if (e.target.id === 'modalback') closeModal();
      });
      document.addEventListener('submit', e => { if (e.target.id === 'aiForm') { e.preventDefault(); const input = $('aiPrompt'); const q = input?.value || ''; askAssistant(q) } });
      document.addEventListener('keydown', e => { if (e.target.id === 'aiPrompt' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('aiForm')?.requestSubmit() } });
      document.addEventListener('input', e => { if (e.target.id === 'caseSearch') { query = e.target.value; casePage = 1; const pos = e.target.selectionStart; render(); const input = $('caseSearch'); if (input) { input.focus(); input.setSelectionRange(pos, pos) } } if (e.target.id === 'endpointSearch') { query = e.target.value; const g = $('endpointGrid'); if (g) g.innerHTML = endpointCards() } });
      document.addEventListener('change', e => { if (e.target.id === 'aiCaseSelect') { assistantCaseId = e.target.value; render(); return } if (e.target.id === 'statusFilter') { statusFilter = e.target.value; casePage = 1; render() } if (e.target.id === 'endpointFilter') { let val = e.target.value; const grid = $('endpointGrid'); let els = state.endpoints.filter(ep => (!query || [ep.host, ep.user, ep.ip, ep.os, ep.id].join(' ').toLowerCase().includes(query.toLowerCase())) && (val === 'All endpoints' || val === 'Needs review' ? true : ep.state === val)); if (val === 'Needs review') els = state.endpoints.filter(ep => ep.security === 'Needs review' && (!query || [ep.host, ep.user, ep.ip, ep.os, ep.id].join(' ').toLowerCase().includes(query.toLowerCase()))); grid.innerHTML = els.map(e => `<div class="card endpoint"><div class="ephead"><div class="epicon">▣</div><div><strong>${esc(e.host)}</strong><small>${esc(e.id)} · ${esc(e.os)}</small></div><div class="epstate">${endpointPill(e)}</div></div><div class="epmeta"><div><span>Assigned user</span><strong>${esc(e.user)}</strong></div><div><span>IP address</span><strong>${esc(e.ip)}</strong></div><div><span>Installed software</span><strong>${e.software} packages</strong></div><div><span>Recent events</span><strong>${e.events} events</strong></div></div><div class="epfoot"><span>Heartbeat ${fmtDate(e.heartbeat)}</span><button class="linkbtn" data-open-endpoint="${e.id}">Details ↗</button></div></div>`).join('') || '<div class="card empty">No endpoints match the selected filter.</div>' } });
      document.addEventListener('change', e => { if (e.target.id === 'modalFile' && e.target.files?.[0]) selectFile(e.target.files[0]) });
      document.addEventListener('dragover', e => { const dz = e.target.closest('#dropzone'); if (dz) { e.preventDefault(); dz.classList.add('drag') } }); document.addEventListener('dragleave', e => { const dz = e.target.closest('#dropzone'); if (dz) dz.classList.remove('drag') }); document.addEventListener('drop', e => { const dz = e.target.closest('#dropzone'); if (dz) { e.preventDefault(); dz.classList.remove('drag'); if (e.dataTransfer.files?.[0]) selectFile(e.dataTransfer.files[0]) } });
      $('closeModal').addEventListener('click', closeModal); $('mobilemenu').addEventListener('click', () => $('sidebar').classList.toggle('open')); document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('sidebar').classList.remove('open') } if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (page !== 'cases') setPage('cases'); setTimeout(() => $('caseSearch')?.focus(), 30) } });
      // Persist the chosen appearance independently from demo business data.
      const THEME_KEY = 'cyberhuntx_theme_v1';
      function applyTheme(theme) { document.body.classList.toggle('light', theme === 'light'); const b = $('themeToggle'); if (b) { const light = theme === 'light'; const symbol = b.querySelector('.theme-symbol'); const label = b.querySelector('.theme-label'); if (symbol) symbol.textContent = light ? '☾' : '☼'; if (label) label.textContent = light ? 'Dark mode' : 'Light mode'; b.title = light ? 'Switch to dark mode' : 'Switch to light mode'; b.setAttribute('aria-label', b.title); b.setAttribute('aria-pressed', String(light)); document.querySelector('meta[name="theme-color"]')?.setAttribute('content', light ? '#f5f7fb' : '#0b1220') } try { localStorage.setItem(THEME_KEY, theme) } catch { } }
      let savedTheme = 'light'; try { savedTheme = localStorage.getItem(THEME_KEY) || 'light' } catch { } applyTheme(savedTheme);
      $('themeToggle').addEventListener('click', () => { const next = document.body.classList.contains('light') ? 'dark' : 'light'; applyTheme(next); toast(next === 'light' ? 'Light mode enabled' : 'Dark mode enabled') });
      render();
    })();
  </script>
