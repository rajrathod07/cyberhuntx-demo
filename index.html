<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0b0e" />
  <title>CyberHuntX | Defensive Triage Console</title>
  <style>
    :root {
      color-scheme: dark
    }

    body {
      --bg: #0a0b0e;
      --s1: #12141a;
      --s2: #191c24;
      --s3: #20242e;
      --line: #363b48;
      --hair: #262a35;
      --text: #f3f4f7;
      --muted: #b4bccb;
      --inv: #0a0b0e;
      --red: #ff4d62;
      --amber: #ffb53d;
      --green: #34d399;
      --blue: #74a0ff;
      --purple: #b49cff;
      --cyan: #74a0ff;
      --panel: var(--s1);
      --panel2: var(--s2);
      --shadow: 0 30px 60px -40px #000;
      --mono: 'DM Mono', ui-monospace, monospace;
      --serif: 'Instrument Serif', Georgia, serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.6 'Hanken Grotesk', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased
    }

    body.light {
      color-scheme: light;
      --bg: #f1f3f5;
      --s1: #fff;
      --s2: #f6f7f9;
      --s3: #eceff2;
      --line: #c3c9d3;
      --hair: #dde1e8;
      --text: #05070a;
      --muted: #434c5c;
      --inv: #fff;
      --red: #d92d45;
      --amber: #b86e00;
      --green: #0f8a62;
      --blue: #2c5fe0;
      --purple: #6b4fd8;
      --shadow: 0 24px 50px -36px #1a2540
    }

    * {
      box-sizing: border-box
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer
    }

    .hide {
      display: none !important
    }

    :focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px
    }

    /* shell */
    .top {
      overflow: hidden;
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 24px;
      height: 64px;
      padding: 0 28px;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--hair)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font: 400 25px/1 var(--serif);
      letter-spacing: -.3px
    }

    .brand em {
      font-style: italic;
      color: var(--red)
    }

    .bmark {
      width: 30px;
      height: 30px;
      color: var(--text)
    }

    .bmark svg {
      width: 100%;
      height: 100%
    }

    .bmark .sw {
      transform-origin: 15px 15px;
      animation: spin 6s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 2px
    }

    .tabs button {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 0;
      background: none;
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 99px;
      font-weight: 600;
      transition: .18s
    }

    .tabs button svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .tabs button:hover {
      color: var(--text);
      background: var(--s2)
    }

    .tabs button.active {
      background: var(--text);
      color: var(--inv)
    }

    .tabs em {
      font: 500 12px var(--mono);
      font-style: normal;
      background: var(--red);
      color: #fff;
      border-radius: 99px;
      padding: 1px 6px
    }

    .tools {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .top .mobilemenu {
      display: none !important
    }

    .role-switch {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 3px
    }

    .role-switch button {
      border: 0;
      background: none;
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 13.6px;
      font-weight: 600;
      white-space: nowrap
    }

    .role-switch button.active {
      background: var(--s3);
      color: var(--text)
    }

    .iconbtn {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: none;
      display: grid;
      place-items: center;
      padding: 0;
      transition: .15s
    }

    .iconbtn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7
    }

    .iconbtn:hover {
      background: var(--s2)
    }

    .theme-label {
      display: none
    }

    #notifyDot {
      position: absolute;
      top: 7px;
      right: 8px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red)
    }

    .user {
      display: flex;
      align-items: center;
      gap: 9px
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--s3);
      display: grid;
      place-items: center;
      font: 500 12.6px var(--mono)
    }

    .user strong {
      display: block;
      font-size: 13.6px;
      line-height: 1.2
    }

    .user small {
      color: var(--muted);
      font-size: 12.6px
    }

    .content {
      max-width: 1320px;
      margin: auto;
      padding: 44px 28px 80px;
      animation: fade .5s both
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(6px)
      }
    }

    /* buttons */
    .btn {
      border: 1px solid var(--line);
      background: var(--s1);
      border-radius: 99px;
      padding: 9px 16px;
      font-weight: 600;
      transition: .15s
    }

    .btn:hover {
      border-color: var(--muted);
      background: var(--s2)
    }

    .btn:active {
      transform: scale(.97)
    }

    .btn:disabled {
      opacity: .4;
      pointer-events: none
    }

    .btn.primary {
      background: var(--text);
      color: var(--inv);
      border-color: var(--text)
    }

    .btn.primary:hover {
      opacity: .88
    }

    .btn.danger {
      color: var(--red);
      border-color: color-mix(in srgb, var(--red) 40%, transparent)
    }

    .btn.ghost {
      background: none
    }

    .btn.small {
      padding: 6px 13px;
      font-size: 13.6px
    }

    .linkbtn {
      background: none;
      border: 0;
      color: var(--blue);
      font-weight: 600;
      font-size: 13.6px
    }

    /* page head */
    .phead {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 30px
    }

    .kick {
      margin: 0 0 10px;
      font: 400 13.6px var(--mono);
      color: var(--muted);
      text-transform: lowercase
    }

    .kick::first-letter {
      text-transform: uppercase
    }

    .phead h1 {
      font: 400 clamp(38px, 5vw, 60px)/1 var(--serif);
      letter-spacing: -.6px;
      margin: 0
    }

    .lede {
      color: var(--muted);
      max-width: 560px;
      margin: 12px 0 0;
      font-size: 15px
    }

    .headactions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .ribbon {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 26px;
      padding: 9px 14px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      font-size: 13.6px
    }

    .ribbon b {
      color: var(--amber);
      font: 500 12.6px var(--mono)
    }

    .demo-banner {
      display: flex;
      gap: 10px;
      margin-bottom: 26px;
      padding: 9px 14px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      font-size: 13.6px
    }

    /* cards + figures */
    .card {
      background: var(--s1);
      border: 1px solid var(--hair);
      border-radius: 20px;
      min-width: 0
    }

    .cardhead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 20px 22px 0
    }

    .cardhead h2 {
      margin: 0;
      font: 400 24px var(--serif);
      letter-spacing: -.3px
    }

    .cardhead p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13.6px
    }

    .cardbody {
      padding: 18px 22px 22px
    }

    .grid {
      display: grid;
      gap: 16px
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      margin-bottom: 28px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line)
    }

    .fig {
      flex: 1;
      min-width: 150px;
      padding: 20px 22px 20px 0;
      display: flex;
      flex-direction: column
    }

    .fig+.fig {
      padding-left: 22px;
      border-left: 1px solid var(--hair)
    }

    .fig b {
      font: 400 54px/1 var(--serif);
      letter-spacing: -1px
    }

    .fig span {
      margin-top: 8px;
      font-weight: 600
    }

    .fig small {
      color: var(--muted);
      font-size: 13.6px
    }

    .fig b::after {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ac);
      margin-left: 6px;
      vertical-align: super
    }

    .split {
      grid-template-columns: 1.5fr 1fr
    }

    /* hero + radar */
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 520px);
      gap: 36px;
      align-items: center;
      margin-bottom: 34px
    }

    .hero h1 {
      font: 400 clamp(44px, 6vw, 84px)/.96 var(--serif);
      letter-spacing: -1.5px;
      margin: 0 0 20px
    }

    .hero .lede {
      max-width: 480px
    }

    .hero .stats {
      margin: 30px 0 24px
    }

    .hero .fig b {
      font-size: 42px
    }

    .hero .fig {
      min-width: 90px;
      padding-right: 16px
    }

    .hero .fig+.fig {
      padding-left: 16px
    }

    .radarbox {
      position: relative;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, var(--s2), transparent 70%)
    }

    .radar {
      width: 100%;
      height: 100%;
      overflow: visible
    }

    .radar .ring {
      fill: none;
      stroke: var(--line);
      stroke-dasharray: 2 5
    }

    .radar .cross {
      stroke: var(--hair)
    }

    .radar text {
      font: 400 10.5px var(--mono);
      fill: var(--muted)
    }

    .rsweep {
      transform-origin: 200px 200px;
      animation: spin 9s linear infinite;
      color: var(--text)
    }

    .blip {
      cursor: pointer;
      animation: fade .6s both
    }

    .blip circle {
      fill: var(--c)
    }

    .blip .halo {
      fill: none;
      stroke: var(--c);
      animation: pulse 2.4s infinite;
      transform-box: fill-box;
      transform-origin: center
    }

    @keyframes pulse {
      0% {
        transform: scale(.6);
        opacity: .9
      }

      100% {
        transform: scale(2.2);
        opacity: 0
      }
    }

    .blip text {
      fill: var(--text);
      opacity: 1;
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 4px;
      stroke-linejoin: round;
      transition: .2s;
      font-size: 11px
    }

    .blip:hover text {
      font-weight: 700
    }

    .blip:hover circle:not(.halo) {
      r: 6
    }

    /* board */
    .sect {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 36px 0 16px
    }

    .sect h2 {
      font: 400 32px var(--serif);
      margin: 0;
      letter-spacing: -.5px
    }

    .sect span {
      color: var(--muted);
      font-size: 13.6px
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px
    }

    .col {
      background: var(--s1);
      border: 1px solid var(--hair);
      border-radius: 20px;
      padding: 14px;
      min-height: 150px
    }

    .col h3 {
      display: flex;
      justify-content: space-between;
      margin: 4px 6px 12px;
      font-size: 14px
    }

    .col h3 i {
      font: 500 12.6px var(--mono);
      font-style: normal;
      color: var(--muted)
    }

    .bcard {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--s2);
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
      transition: .2s
    }

    .bcard:hover {
      border-color: var(--muted);
      transform: translateY(-2px)
    }

    .bcard::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--rc, var(--blue))
    }

    .bcard strong {
      display: block
    }

    .bcard small {
      font: 400 12.6px var(--mono);
      color: var(--muted)
    }

    .bmeta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 12.6px;
      color: var(--muted)
    }

    .mal {
      --rc: var(--red)
    }

    .sus {
      --rc: var(--amber)
    }

    .safe,
    .pen {
      --rc: var(--green)
    }

    .pen {
      --rc: var(--blue)
    }

    .coldim {
      color: var(--muted);
      font-size: 13.6px;
      padding: 20px 8px;
      text-align: center
    }

    .sys {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--hair)
    }

    .sys:last-child {
      border: 0
    }

    .sys i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--c)
    }

    .sys div {
      flex: 1
    }

    .sys strong {
      display: block;
      font-size: 14px
    }

    .sys small {
      color: var(--muted);
      font-size: 12.6px
    }

    .sys span {
      font: 400 12.6px var(--mono);
      color: var(--c)
    }

    .tl {
      list-style: none;
      margin: 0;
      padding: 0 0 0 14px;
      border-left: 1px solid var(--line)
    }

    .tl li {
      position: relative;
      padding: 0 0 16px 14px;
      font-size: 13.5px
    }

    .tl li::before {
      content: "";
      position: absolute;
      left: -19px;
      top: 6px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--s3);
      border: 2px solid var(--muted)
    }

    .tl small {
      display: block;
      color: var(--muted);
      font: 400 12.6px var(--mono)
    }

    /* ledger rows */
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .field,
    .select,
    .textarea {
      background: var(--s1);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      outline: none;
      min-width: 0;
      transition: .15s
    }

    .field.search {
      width: min(320px, 100%);
      border-radius: 99px
    }

    .select {
      border-radius: 99px
    }

    .field:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 20%, transparent)
    }

    .textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical
    }

    .lrow {
      position: relative;
      display: grid;
      grid-template-columns: minmax(220px, 1.6fr) 62px minmax(180px, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 16px 20px 16px 24px;
      background: var(--s1);
      border: 1px solid var(--hair);
      border-radius: 16px;
      margin-bottom: 8px;
      transition: .2s;
      overflow: hidden
    }

    .lrow::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--rc)
    }

    .lrow:hover {
      border-color: var(--line);
      background: var(--s2);
      transform: translateX(3px)
    }

    .lmain {
      display: flex;
      gap: 14px;
      align-items: center;
      min-width: 0
    }

    .lmain strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .lmain small {
      color: var(--muted);
      font: 400 12.6px var(--mono)
    }

    .fext,
    .fileicon {
      flex: none;
      width: 38px;
      height: 44px;
      border-radius: 6px 12px 6px 6px;
      background: var(--s3);
      display: grid;
      place-items: end center;
      padding-bottom: 6px;
      font: 500 11px var(--mono);
      color: var(--muted)
    }

    .meter {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 20px
    }

    .meter i {
      width: 6px;
      border-radius: 2px;
      background: var(--s3)
    }

    .meter i:nth-child(1) {
      height: 6px
    }

    .meter i:nth-child(2) {
      height: 10px
    }

    .meter i:nth-child(3) {
      height: 15px
    }

    .meter i:nth-child(4) {
      height: 20px
    }

    .meter i.on {
      background: var(--rc)
    }

    .lpills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .tablefoot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 13.6px;
      padding: 14px 4px
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 99px;
      padding: 3px 10px;
      font-size: 12.6px;
      font-weight: 600;
      white-space: nowrap;
      background: color-mix(in srgb, var(--pc, var(--blue)) 14%, transparent);
      color: var(--pc, var(--blue))
    }

    .pill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor
    }

    .pill.safe,
    .pill.resolved,
    .pill.online {
      --pc: var(--green)
    }

    .pill.suspicious,
    .pill.stale {
      --pc: var(--amber)
    }

    .pill.malicious {
      --pc: var(--red)
    }

    .pill.malicious::before {
      animation: blink 1.4s infinite
    }

    .pill.analysis {
      --pc: var(--purple)
    }

    @keyframes blink {
      50% {
        opacity: .2
      }
    }

    /* tables */
    .tablewrap {
      overflow: auto
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 640px
    }

    th {
      text-align: left;
      font: 500 12.6px var(--mono);
      color: var(--muted);
      padding: 14px 20px;
      border-bottom: 1px solid var(--line)
    }

    td {
      padding: 14px 20px;
      border-bottom: 1px solid var(--hair);
      font-size: 14px
    }

    tr:last-child td {
      border: 0
    }

    tbody tr:hover {
      background: var(--s2)
    }

    .filecell {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .filecell small,
    .empty small {
      display: block;
      color: var(--muted);
      font-size: 12.6px
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted)
    }

    .empty strong {
      display: block;
      color: var(--text);
      font: 400 24px var(--serif);
      margin-bottom: 4px
    }

    .footnote {
      color: var(--muted);
      font-size: 13.6px;
      margin-top: 16px
    }

    .divider {
      height: 1px;
      background: var(--hair);
      margin: 14px 0
    }

    /* employee */
    .drop {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 28px;
      align-items: center;
      padding: 34px;
      border: 1.5px dashed var(--line);
      border-radius: 28px;
      background: radial-gradient(circle at 0 0, var(--s2), transparent 60%);
      margin-bottom: 34px;
      transition: .2s
    }

    .drop:hover {
      border-color: var(--text)
    }

    .drop .big {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--text);
      color: var(--inv);
      display: grid;
      place-items: center;
      font-size: 30px
    }

    .drop h2 {
      font: 400 36px/1.05 var(--serif);
      margin: 0 0 6px
    }

    .drop p {
      margin: 0;
      color: var(--muted)
    }

    .track {
      background: var(--s1);
      border: 1px solid var(--hair);
      border-radius: 20px;
      padding: 20px 22px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: minmax(200px, 1fr) minmax(240px, 1.2fr) auto;
      gap: 22px;
      align-items: center
    }

    .steps {
      display: flex;
      align-items: center
    }

    .stp {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 12.6px;
      color: var(--muted);
      flex: none
    }

    .stp i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--line);
      background: var(--s1)
    }

    .stp.on {
      color: var(--text)
    }

    .stp.on i {
      background: var(--c, var(--green));
      border-color: var(--c, var(--green))
    }

    .bar {
      flex: 1;
      height: 2px;
      background: var(--line);
      margin: 0 6px 18px
    }

    .bar.on {
      background: var(--green)
    }

    .employee-status {
      border-radius: 16px;
      background: var(--s2);
      padding: 16px 18px;
      margin-bottom: 16px
    }

    .employee-status strong {
      font: 400 22px var(--serif)
    }

    .employee-status p {
      margin: 4px 0 0;
      color: var(--muted)
    }

    /* endpoints */
    .endpointgrid {
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr))
    }

    .endpoint {
      padding: 20px;
      transition: .2s
    }

    .endpoint:hover {
      transform: translateY(-3px);
      border-color: var(--line)
    }

    .ephead {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px
    }

    .epicon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--s3);
      display: grid;
      place-items: center
    }

    .ephead small {
      display: block;
      color: var(--muted);
      font-size: 12.6px
    }

    .epstate {
      margin-left: auto;
      display: flex;
      gap: 4px;
      flex-wrap: wrap
    }

    .epmeta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .epmeta span {
      display: block;
      color: var(--muted);
      font-size: 12.6px
    }

    .epmeta strong {
      font: 500 13.6px var(--mono)
    }

    .epfoot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--hair);
      color: var(--muted);
      font-size: 12.6px
    }

    .statusline {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0
    }

    .statuscircle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--s3);
      display: grid;
      place-items: center
    }

    .statusline small {
      display: block;
      color: var(--muted);
      font-size: 12.6px
    }

    .statusright {
      margin-left: auto;
      font-size: 13.6px;
      color: var(--green)
    }

    /* modal drawer */
    .modalback {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #0008;
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: .25s
    }

    .modalback.open {
      opacity: 1;
      pointer-events: auto
    }

    .modal {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: min(600px, 100%);
      display: flex;
      flex-direction: column;
      background: var(--s1);
      border-left: 1px solid var(--line);
      transform: translateX(100%);
      transition: transform .35s cubic-bezier(.2, .8, .2, 1)
    }

    .open .modal {
      transform: none
    }

    .modalhead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 26px;
      border-bottom: 1px solid var(--hair)
    }

    .modalhead h2 {
      margin: 0;
      font: 400 28px var(--serif)
    }

    .close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: none;
      font-size: 20px;
      line-height: 1
    }

    .modalbody {
      flex: 1;
      overflow: auto;
      padding: 24px 26px
    }

    .modalfoot {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      padding: 16px 26px;
      border-top: 1px solid var(--hair);
      background: var(--s1)
    }

    .detailgrid,
    .formgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .detailitem {
      background: var(--s2);
      border-radius: 12px;
      padding: 12px 14px;
      min-width: 0
    }

    .detailitem span,
    .formgroup label {
      display: block;
      color: var(--muted);
      font-size: 12.6px;
      margin-bottom: 3px
    }

    .detailitem strong {
      font: 500 13.6px var(--mono);
      word-break: break-all
    }

    .formgroup.full {
      grid-column: 1/-1
    }

    .formgroup .field,
    .formgroup .select {
      width: 100%
    }

    .subheading {
      font: 400 22px var(--serif);
      margin: 24px 0 10px
    }

    .finding {
      background: var(--s2);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      font-size: 14px
    }

    .finding strong {
      display: block
    }

    .finding small {
      color: var(--muted)
    }

    .notice {
      border-left: 3px solid var(--amber);
      background: var(--s2);
      border-radius: 4px 12px 12px 4px;
      padding: 11px 14px;
      font-size: 13.6px;
      color: var(--muted)
    }

    .dropzone {
      text-align: center;
      padding: 36px 20px;
      border: 1.5px dashed var(--line);
      border-radius: 20px;
      transition: .2s
    }

    .dropzone:hover,
    .dropzone.drag {
      border-color: var(--text);
      background: var(--s2)
    }

    .upico {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--text);
      color: var(--inv);
      display: grid;
      place-items: center;
      margin: 0 auto 10px;
      font-size: 22px
    }

    .toaststack {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 60;
      display: grid;
      gap: 8px
    }

    .toast {
      background: var(--text);
      color: var(--inv);
      border-radius: 14px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
      animation: slide .35s cubic-bezier(.2, .9, .3, 1.2)
    }

    .toast strong {
      display: block
    }

    .toast small {
      opacity: .65
    }

    @keyframes slide {
      from {
        opacity: 0;
        transform: translateX(30px)
      }
    }

    /* AI */
    .ai-layout {
      grid-template-columns: 340px 1fr;
      align-items: start
    }

    .ai-sidebar {
      display: grid;
      gap: 14px
    }

    .ai-context {
      padding: 20px
    }

    .ai-context-top {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px
    }

    .ai-context-top small {
      display: block;
      color: var(--muted);
      font-size: 12.6px
    }

    .ai-orb {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--blue), var(--purple), var(--red), var(--blue));
      display: grid;
      place-items: center;
      color: #fff;
      animation: spin 10s linear infinite
    }

    .ai-fieldlabel {
      font-size: 12.6px;
      color: var(--muted)
    }

    .ai-case-select {
      width: 100%;
      margin: 6px 0 12px
    }

    .ai-facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0
    }

    .ai-fact {
      background: var(--s2);
      border-radius: 10px;
      padding: 9px 11px
    }

    .ai-fact span {
      display: block;
      color: var(--muted);
      font-size: 12px
    }

    .ai-fact strong {
      font-size: 13.6px
    }

    .ai-context-summary {
      color: var(--muted);
      font-size: 13.6px
    }

    .ai-prompts {
      display: grid;
      gap: 6px
    }

    .ai-prompt {
      display: flex;
      gap: 10px;
      align-items: center;
      text-align: left;
      border: 1px solid var(--hair);
      background: var(--s2);
      border-radius: 12px;
      padding: 10px 12px;
      transition: .15s
    }

    .ai-prompt:hover {
      border-color: var(--muted)
    }

    .ai-prompt span:first-of-type {
      flex: 1
    }

    .prompt-arrow {
      color: var(--muted)
    }

    .ai-disclaimer {
      display: flex;
      gap: 10px;
      font-size: 12.6px;
      color: var(--muted);
      padding: 0 6px
    }

    .ai-chat {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 230px);
      min-height: 520px
    }

    .ai-chat-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--hair)
    }

    .ai-chat-title {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .ai-chat-title small {
      display: block;
      color: var(--muted);
      font-size: 12.6px
    }

    .ai-state {
      font: 400 12.6px var(--mono);
      color: var(--amber)
    }

    .ai-messages {
      flex: 1;
      overflow: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px
    }

    .ai-message {
      display: flex;
      gap: 12px;
      max-width: 88%
    }

    .ai-message.user {
      align-self: flex-end;
      flex-direction: row-reverse
    }

    .ai-message-avatar {
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--s3);
      display: grid;
      place-items: center;
      font: 500 12px var(--mono)
    }

    .ai-message-meta {
      display: flex;
      gap: 8px;
      font-size: 12.6px;
      color: var(--muted);
      margin-bottom: 4px
    }

    .ai-message-meta strong {
      color: var(--text)
    }

    .ai-bubble {
      white-space: pre-wrap;
      background: var(--s2);
      border-radius: 4px 18px 18px 18px;
      padding: 13px 16px;
      font-size: 14px;
      line-height: 1.6
    }

    .user .ai-bubble {
      background: var(--text);
      color: var(--inv);
      border-radius: 18px 4px 18px 18px
    }

    .ai-citation {
      font: 400 12px var(--mono);
      color: var(--muted);
      margin-top: 5px
    }

    .ai-composer {
      padding: 14px 20px;
      border-top: 1px solid var(--hair)
    }

    .ai-composer-form {
      display: flex;
      gap: 10px;
      align-items: flex-end
    }

    .ai-prompt-input {
      flex: 1;
      resize: none;
      background: var(--s2);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 16px;
      outline: none
    }

    .ai-send {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%
    }

    .ai-composer-note {
      color: var(--muted);
      font-size: 12.6px;
      margin-top: 8px
    }

    .ai-empty {
      text-align: center
    }

    /* responsive */
    @media(max-width:1560px) {
      .user .usertext {
        display: none
      }

      .tabs button {
        padding: 8px 9px;
        gap: 6px;
        font-size: 15px
      }

      .top {
        gap: 10px;
        padding: 0 20px
      }
    }

    @media(max-width:1200px) and (min-width:861px) {
      .tabs button:not(.active) span {
        display: none
      }

      .tabs button {
        padding: 8px 11px
      }
    }

    @media(max-width:1000px) {
      .hero {
        grid-template-columns: 1fr
      }

      .radarbox {
        max-width: 460px;
        margin: auto
      }

      .split,
      .ai-layout,
      .board {
        grid-template-columns: 1fr
      }

      .lrow {
        grid-template-columns: 1fr auto
      }

      .meter {
        display: none
      }

      .lpills {
        grid-column: 1
      }

      .track {
        grid-template-columns: 1fr
      }

      .ai-chat {
        height: 70vh
      }

      .user .usertext {
        display: none
      }
    }

    @media(max-width:860px) {
      .top {
        overflow: visible;
        backdrop-filter: none;
        background: var(--bg);
        grid-template-columns: auto 1fr;
        padding: 0 16px;
        gap: 10px
      }

      .tools {
        justify-content: flex-end
      }

      .tabs {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: 10px;
        z-index: 25;
        background: color-mix(in srgb, var(--s1) 90%, transparent);
        backdrop-filter: blur(16px);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 6px;
        justify-content: space-around;
        box-shadow: var(--shadow)
      }

      .tabs button {
        flex-direction: column;
        gap: 2px;
        padding: 7px 4px;
        font-size: 12px;
        flex: 1;
        min-width: 0;
        border-radius: 16px;
        position: relative
      }

      .tabs em {
        position: absolute;
        top: 2px;
        right: 2px
      }

      .content {
        padding: 28px 16px 110px
      }

      .phead {
        flex-direction: column;
        align-items: flex-start
      }

      .drop {
        grid-template-columns: 1fr;
        padding: 24px
      }

      .role-switch button {
        padding: 5px 9px
      }

      .detailgrid,
      .formgrid {
        grid-template-columns: 1fr
      }

      .modal {
        top: 8%;
        border-radius: 24px 24px 0 0;
        border-left: 0;
        transform: translateY(100%)
      }
    }

    @media(max-width:700px) {
      .user {
        display: none
      }

      .brand>span:last-child {
        display: none
      }

      .top {
        padding: 0 12px
      }

      .tools {
        gap: 6px
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important
      }
    }

    .phead {
      margin-bottom: 20px
    }

    .phead h1 {
      font-size: clamp(30px, 3.2vw, 40px)
    }

    .lede {
      font-size: 14.5px;
      margin-top: 6px
    }

    .content {
      padding: 28px 28px 80px
    }

    .sect h2 {
      font-size: 26px
    }

    .cardhead {
      padding: 16px 20px 0
    }

    .cardhead h2 {
      font-size: 21px
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 16px
    }

    .kpi {
      text-align: left;
      background: var(--s1);
      border: 1px solid var(--hair);
      border-left: 3px solid var(--ac);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: baseline;
      gap: 10px;
      transition: .15s
    }

    .kpi:hover {
      border-color: var(--muted);
      border-left-color: var(--ac);
      background: var(--s2)
    }

    .kpi b {
      font: 400 34px/1 var(--serif)
    }

    .kpi span {
      font-weight: 600;
      color: var(--muted)
    }

    .ovgrid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 16px;
      align-items: start
    }

    .side {
      display: grid;
      gap: 16px
    }

    .dt th {
      position: sticky;
      top: 0;
      background: var(--s1);
      padding: 12px 16px
    }

    .dt td {
      padding: 11px 16px;
      vertical-align: middle
    }

    .dt .rk {
      width: 4px;
      height: 34px;
      border-radius: 2px;
      background: var(--rc);
      flex: none
    }

    .dt strong {
      display: block
    }

    .dt tbody tr {
      transition: background .12s
    }

    .dt tbody tr:hover {
      background: var(--s2)
    }

    .rowactions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      white-space: nowrap
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .chip {
      border: 1px solid var(--line);
      background: none;
      border-radius: 99px;
      padding: 6px 12px;
      font-weight: 600;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      gap: 8px;
      align-items: center;
      transition: .15s
    }

    .chip i {
      font: 500 12px var(--mono);
      font-style: normal
    }

    .chip:hover {
      color: var(--text);
      border-color: var(--muted)
    }

    .chip.on {
      background: var(--text);
      color: var(--inv);
      border-color: var(--text)
    }

    .mix {
      display: flex;
      height: 12px;
      border-radius: 99px;
      overflow: hidden;
      gap: 2px;
      background: var(--s3)
    }

    .mixleg {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted)
    }

    .mixleg span::before {
      content: "";
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--c);
      margin-right: 6px
    }

    .drop {
      padding: 20px 24px;
      margin-bottom: 22px
    }

    .drop h2 {
      font-size: 28px
    }

    .drop .big {
      width: 56px;
      height: 56px;
      font-size: 24px
    }

    .track {
      padding: 14px 18px
    }

    @media(max-width:1000px) {
      .ovgrid {
        grid-template-columns: 1fr
      }

      .kpis {
        grid-template-columns: repeat(2, 1fr)
      }

      .dt {
        min-width: 620px
      }
    }

    .dt td,
    .dt th {
      white-space: nowrap
    }

    .dt td:first-child {
      white-space: normal;
      min-width: 200px
    }

    .dt .rowactions .btn {
      padding: 6px 11px
    }

    .ovgrid {
      grid-template-columns: minmax(0, 1fr) 290px
    }

    .dt th,
    .dt td {
      padding-left: 12px;
      padding-right: 12px
    }

    .hero2 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 32px;
      align-items: center;
      margin-bottom: 22px;
      padding: 8px 0
    }

    .hero2 h1 {
      font: 400 clamp(34px, 4.2vw, 56px)/1.02 var(--serif);
      letter-spacing: -1px;
      margin: 0 0 12px
    }

    .hero2 .kpis {
      grid-template-columns: repeat(4, 1fr);
      margin: 22px 0 18px
    }

    .hero2 .kpi {
      flex-direction: column;
      gap: 2px;
      align-items: flex-start
    }

    .hero2 .radarbox {
      width: 100%;
      max-width: 420px;
      margin-left: auto
    }

    .ovgrid {
      align-items: stretch
    }

    .tcard {
      display: flex;
      flex-direction: column
    }

    .tcard .tablewrap {
      flex: 1
    }

    .side {
      display: flex;
      flex-direction: column
    }

    .side .grow {
      flex: 1
    }

    .side .tl {
      margin-top: 4px
    }

    .content.swap {
      animation: swap .38s cubic-bezier(.2, .8, .2, 1)
    }

    @keyframes swap {
      from {
        opacity: 0;
        transform: translateY(10px)
      }
    }

    .content {
      animation: none
    }

    .tabs {
      position: relative
    }

    .tabs button {
      position: relative;
      z-index: 1
    }

    .tabs .ind {
      position: absolute;
      top: 0;
      bottom: 0;
      margin: auto 0;
      height: 100%;
      border-radius: 99px;
      background: var(--text);
      transition: left .38s cubic-bezier(.3, .9, .3, 1), width .38s cubic-bezier(.3, .9, .3, 1);
      z-index: 0
    }

    .tabs button.active {
      background: transparent;
      color: var(--inv);
      transition: color .25s
    }

    .tabs button:hover:not(.active) {
      background: var(--s2)
    }

    @media(max-width:1000px) {
      .hero2 {
        grid-template-columns: 1fr
      }

      .hero2 .radarbox {
        margin: auto
      }

      .hero2 .kpis {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media(max-width:860px) {
      .tabs .ind {
        display: none
      }

      .tabs button.active {
        background: var(--text)
      }
    }

    .hero2 {
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 28px;
      margin-bottom: 16px;
      padding: 0
    }

    .hero2 .radarbox {
      max-width: 350px
    }

    .ribbon {
      margin-bottom: 14px
    }

    .field::placeholder,
    .textarea::placeholder,
    .ai-prompt-input::placeholder {
      color: var(--muted);
      opacity: 1
    }

    .lede,
    .ai-bubble,
    td,
    .finding,
    .detailitem strong {
      color: var(--text)
    }

    .lede,
    .kick {
      color: var(--muted)
    }

    .lmain small,
    .bcard small,

      function drawNav() {const emp = state.role === 'employee'; const it = emp ? [['overview', 'home', 'Home'], ['cases', 'cases', 'Submissions'], ['reports', 'reports', 'Reports']] : [['overview', 'overview', 'Overview'], ['cases', 'cases', 'Cases', 'p'], ['endpoints', 'endpoints', 'Endpoints'], ['reports', 'reports', 'Reports'], ['ai', 'ai', 'Assistant'], ['audit', 'audit', 'Audit'], ['settings', 'settings', 'Settings']]; $('nav').innerHTML = it.map(([k, i, l, b]) => `<button data-page="${k}" class="${page === k ? 'active' : ''}"><svg viewBox="0 0 24 24">${NAVI[i]}</svg><span>${l}</span>${b && counts().pending ? `<em>${counts().pending}</em>` : ''}</button>`).join(''); moveInd()}
      let _il = null, _iw = 0; function moveInd() {const n = $('nav'), a = n.querySelector('.active'); if (!a) return; const d = document.createElement('span'); d.className = 'ind'; n.prepend(d); const l = a.offsetLeft, w = a.offsetWidth; if (_il !== null) {d.style.left = _il + 'px'; d.style.width = _iw + 'px'; d.getBoundingClientRect()} d.style.left = l + 'px'; d.style.width = w + 'px'; _il = l; _iw = w}

      function head(k, t, d, a = '') {return `<header class="phead"><div><p class="kick">${k}</p><h1>${t}</h1><p class="lede">${d}</p></div><div class="headactions">${a}</div></header>`}

      function caseRow(c, emp) {const v = vc(c.verdict), l = {mal: 4, sus: 3, pen: 2, safe: 1}[v]; return `<article class="lrow ${v}"><div class="lmain"><span class="fext">EXE</span><div><strong>${esc(c.file)}</strong><small>${esc(c.id)} · ${emp ? '' : esc(c.employee) + ' · '}${ago(c.submitted)} · ${fmtSize(c.size)}</small></div></div><div class="meter" title="Risk level">${[1, 2, 3, 4].map(i => `<i class="${i <= l ? 'on' : ''}"></i>`).join('')}</div><div class="lpills">${pill(emp && c.status !== 'Resolved' ? c.status : c.verdict)}${emp ? '' : pill(c.status)}</div><button class="btn small" data-open-case="${esc(c.id)}">${emp ? 'View update' : 'Investigate'}</button></article>`}
      function filteredCases() {let all = cases().filter(c => state.role !== 'employee' || c.employee === 'Raj Rathod'); if (query) all = all.filter(c => [c.id, c.file, c.employee, c.verdict, c.status].join(' ').toLowerCase().includes(query.toLowerCase())); if (statusFilter !== 'All statuses') all = all.filter(c => c.status === statusFilter || c.verdict === statusFilter); return all}

      function casesTable(f = true) {
        const all = filteredCases(), total = all.length, per = 10, pages = Math.max(1, Math.ceil(total / per)); casePage = Math.min(casePage, pages); const sh = all.slice((casePage - 1) * per, casePage * per), emp = state.role === 'employee', c = counts(), ch = (l, v, n) => `<button class="chip ${statusFilter === v ? 'on' : ''}" data-filter="${v}">${l}<i>${n}</i></button>`;

          openModal('Your submission', employeeBody, [{label: 'Open report', action: 'report'}, {label: 'Close', action: 'close'}]); return;

        let body = `<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px"><div><div style="color:var(--muted);font-size:11px">${esc(c.id)}</div><div style="font-size:19px;font-weight:750;margin-top:3px">${esc(c.file)}</div><div style="font-size:11px;color:var(--muted);margin-top:3px">Submitted by ${esc(c.employee)} · ${fmtDate(c.submitted)}</div></div><div>${pill(c.verdict)} ${pill(c.status)}</div></div><div class="notice" style="margin-bottom:15px">SIMULATED ANALYSIS — The displayed findings are seeded demo data, not scan results generated from the uploaded file. Static indicators do not prove a file is safe or malicious.</div><div class="detailgrid"><div class="detailitem"><span>File size</span><strong>${fmtSize(c.size)}</strong></div><div class="detailitem"><span>Architecture</span><strong>${esc(a.arch || 'Unavailable')}</strong></div><div class="detailitem"><span>SHA-256</span><strong style="font-size:10px">${esc(c.sha256 || 'Not available')}</strong></div><div class="detailitem"><span>PE inspection</span><strong>${esc(a.pe || 'Not available')}</strong></div><div class="detailitem"><span>Entropy (sample)</span><strong>${a.entropy ?? 'Unavailable'}</strong></div><div class="detailitem"><span>YARA matches</span><strong>${(a.yara || []).length} illustrative match(es)</strong></div></div><h3 class="subheading">Static analysis indicators</h3>${(a.findings || []).map(f => `<div class="finding"><strong>${esc(f[0])}</strong>${esc(f[1])}<br><small>${esc(f[2])}</small></div>`).join('')}<div class="finding"><strong>Import table (sample)</strong><small>${esc((a.imports || []).join(', ') || 'No sample imports provided')}</small></div><h3 class="subheading">AI-assisted explanation</h3><div class="finding"><strong>Mock local-AI response</strong>${esc(a.summary || 'No explanation available.')}<small style="display:block;margin-top:5px">Provenance: predefined demonstration text; llama.cpp is not connected in this single-file demo.</small></div><h3 class="subheading">Investigation notes</h3>${(c.notes || []).map(n => `<div class="finding"><strong>${esc(n.author)} · ${fmtDate(n.time)}</strong>${esc(n.text)}</div>`).join('') || '<div class="finding"><small>No notes recorded yet.</small></div>'}`;
        let buttons = [{label: 'Export report', action: 'report'}, {label: 'Close', action: 'close'}]; if (state.role === 'admin') buttons = [{label: 'Ask AI Assistant', action: 'ask-ai'}, {label: 'Add note', action: 'note'}, {label: 'Record decision', action: 'decision', primary: true}, {label: 'Export report', action: 'report'}, {label: 'Close', action: 'close'}]; else buttons = [{label: 'Export report', action: 'report'}, {label: 'Close', action: 'close'}]; openModal('Case investigation', body, buttons)
      }
      function decisionForm() {const c = state.cases.find(x => x.id === selectedCase); if (!c) return; openModal('Record administrator decision', `<div class="notice" style="margin-bottom:15px">This is a demonstration decision stored in this browser. Real deployment requires authenticated backend authorization and a validated analysis pipeline.</div><div class="formgrid"><div class="formgroup"><label>Case ID</label><input class="field" value="${esc(c.id)}" disabled /></div><div class="formgroup"><label>Security verdict</label><select class="select" id="decisionVerdict"><option>Safe</option><option>Suspicious</option><option>Malicious</option></select></div><div class="formgroup"><label>Workflow status</label><select class="select" id="decisionStatus"><option>Resolved</option><option>Escalated</option><option>Pending review</option></select></div><div class="formgroup full"><label>Decision explanation (required)</label><textarea class="textarea" id="decisionText" placeholder="Explain the evidence and limitations behind this demonstration decision…"></textarea></div></div>`, [{label: 'Cancel', action: 'back-detail'}, {label: 'Save decision', action: 'save-decision', primary: true}]);}

      function reportText(c) {if (state.role === 'employee') {const decision = (c.notes || []).filter(n => /^Decision:/.test(n.text)).map(n => n.text).join('\n') || 'No additional review note recorded.'; return `CyberHuntX — My Submission Summary\n\nDEMONSTRATION REPORT — example data only\nSubmission ID: ${c.id}\nFile name: ${c.file}\nSubmitted: ${c.submitted}\nCurrent status: ${c.status}\nSecurity team result: ${c.verdict === 'Pending' ? 'Not available yet' : c.verdict}\n\nWhat this means:\n${c.verdict === 'Safe' ? 'The security team recorded a Safe result based on the available review. This is not an absolute guarantee that a file is harmless.' : c.verdict === 'Suspicious' ? 'The security team needs more checking. Follow your organisation’s IT guidance and do not share the file elsewhere.' : c.verdict === 'Malicious' ? 'The security team marked this file as Malicious. Do not open or share it. Contact your IT team if you need help.' : 'Your submission is waiting for review. Check this page for an update.'}\n\nReview update:\n${decision}\n\nNote: This website uses demonstration data and has not scanned or executed the selected file.`;} return `CyberHuntX Investigation Report\n\nDEMONSTRATION REPORT — ${c.analysis?.mode || 'SIMULATED'} DATA\nCase ID: ${c.id}\nFile: ${c.file}\nSize: ${fmtSize(c.size)}\nEmployee: ${c.employee}\nSubmitted: ${c.submitted}\nWorkflow status: ${c.status}\nSecurity verdict: ${c.verdict}\nSHA-256: ${c.sha256 || 'Not available'}\n\nAnalysis summary:\n${c.analysis?.summary || 'No analysis summary available.'}\n\nFindings:\n${(c.analysis?.findings || []).map(f => `${f[0]}: ${f[1]}\nInterpretation: ${f[2]}`).join('\n\n')}\n\nAdministrator notes:\n${(c.notes || []).map(n => `[${n.time}] ${n.author}: ${n.text}`).join('\n') || 'No notes recorded.'}\n\nLIMITATION: This single-file website uses demonstration data. It has not scanned or executed the uploaded file.`}
      function showReport(id) {const c = state.cases.find(x => x.id === id); if (!c) return; const win = window.open('', '_blank'); if (!win) {downloadText(`${c.id}-report.txt`, reportText(c), 'text/plain'); return } win.document.write(`<!doctype html><html><head><title>${esc(c.id)} report</title><style>body{font:14px/1.6 Arial,sans-serif;max-width:850px;margin:40px auto;color:#172033;padding:0 22px}h1{font-size:24px}pre{white-space:pre-wrap;font:13px/1.6 monospace;background:#f3f5f8;padding:18px;border:1px solid #dce2eb;border-radius:8px}.mark{background:#fff4d8;padding:10px;border:1px solid #ead18a}</style></head><body><h1>CyberHuntX Investigation Report</h1><p class="mark">DEMONSTRATION REPORT — Simulated analysis data. Not a real malware scan.</p><pre>${esc(reportText(c))}</pre><button onclick="window.print()">Print / Save as PDF</button></body></html>`); win.document.close(); audit('Report opened for print', c.id, 'Demonstration report view generated')}
      function downloadText(name, text, type = 'text/plain') {const blob = new Blob([text], {type}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000)}
      function exportCases() {let rows = [['Case ID', 'File', 'Employee', 'Submitted', 'Status', 'Verdict', 'Size bytes', 'SHA-256'], ...cases().map(c => [c.id, c.file, c.employee, c.submitted, c.status, c.verdict, c.size, c.sha256 || ''])]; const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n'); downloadText('cyberhuntx-cases.csv', csv, 'text/csv'); toast('Case list exported', 'CSV contains demonstration data.')}
      function uploadModal() {openModal('Submit a file for review', `<div class="notice" style="margin-bottom:14px">Demo only: this page does not send or run your file. It keeps only the file name, size and a browser-calculated hash for the example case. Use a harmless test file.</div><div class="dropzone" id="dropzone"><div class="upico">⇧</div><strong id="dropTitle">Choose a .EXE file or drop it here</strong><p id="dropDesc">Maximum demo file size: 25 MB</p><button type="button" class="btn" id="chooseFile">Choose file</button><input type="file" id="modalFile" accept=".exe,application/octet-stream" hidden></div><div id="fileStatus" style="margin-top:12px;font-size:11px;color:var(--muted)">No file selected.</div><div class="formgroup" style="margin-top:15px"><label>Reason for review</label><textarea class="textarea" id="uploadReason" placeholder="Tell us why you are submitting this file (optional)"></textarea></div>`, [{label: 'Cancel', action: 'close'}, {label: 'Submit for review', action: 'create-case', primary: true}]);}
      async function selectFile(file) {if (!file) return; if (!file.name.toLowerCase().endsWith('.exe')) {pendingFile = null; $('fileStatus').innerHTML = '<span style="color:var(--red)">Please select a file with the .exe extension.</span>'; return } if (file.size > 25 * 1024 * 1024) {pendingFile = null; $('fileStatus').innerHTML = '<span style="color:var(--red)">File exceeds the 25 MB demonstration limit.</span>'; return } pendingFile = file; $('dropTitle').textContent = file.name; $('dropDesc').textContent = fmtSize(file.size) + ' · metadata only'; $('fileStatus').innerHTML = '<span style="color:var(--green)">✓ File selected. It will not be executed or uploaded.</span> <span id="hashProgress"></span>';}
      async function createCase() {if (!pendingFile) {toast('Select an EXE first', 'Use a harmless test file for the demo.'); return } const f = pendingFile; let hash = ''; try {if (f.size <= 25 * 1024 * 1024 && crypto?.subtle) {const buf = await f.arrayBuffer(); const digest = await crypto.subtle.digest('SHA-256', buf); hash = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('')} } catch { } const id = 'CHX-' + new Date().getFullYear() + '-' + String(Math.max(1043, ...state.cases.map(c => Number(c.id.split('-').pop()) + 1))).padStart(4, '0'); const reason = ($('uploadReason')?.value || '').trim(); const c = {id, file: f.name, size: f.size, employee: 'Raj Rathod', email: 'Raj.Rathod@example.test', submitted: new Date().toISOString(), status: 'Pending review', verdict: 'Pending', sha256: hash, source: 'User-selected file metadata only', reason, notes: [], analysis: {mode: 'SIMULATED', pe: 'Not analysed in demo mode', arch: 'Not determined', entropy: null, imports: [], yara: [], summary: 'No actual static analysis was performed. The demo record is awaiting administrator review. Connect the FastAPI analysis service to obtain genuine findings.', findings: [['Analysis status', 'The file was submitted to the demonstration workflow.', 'No PE parsing, entropy calculation, disassembly or YARA scan has been run.']]}, events: [{time: new Date().toISOString(), text: 'Submitted through single-file demonstration UI'}]}; state.cases.unshift(c); notify('New case submitted', id + ' · ' + f.name); audit('File metadata submitted', id, 'Demo record created; file bytes were not uploaded or retained. ' + (reason ? 'Reason: ' + reason : '')); save(); closeModal(); page = 'cases'; state.role = 'employee'; render(); toast('Demo case created', id + ' is now visible to the administrator.');}
      function notificationsModal() {state.notifications.forEach(n => n.read = true); save(); const body = state.notifications.length ? state.notifications.map(n => `<div class="finding"><strong>${esc(n.title)}</strong>${esc(n.detail)}<small style="display:block;margin-top:4px">${fmtDate(n.time)}</small></div>`).join('') : '<div class="empty">No notifications yet.</div>'; openModal('Notifications', body, [{label: 'Mark all read & close', action: 'close'}]); render()}
      function resetDemo() {if (!confirm('Reset all CyberHuntX demo changes in this browser and restore the original sample data?')) return; const oldRole = state.role; state = initial(); state.role = oldRole; assistantCaseId = null; save(); page = 'overview'; query = ''; statusFilter = 'All statuses'; closeModal(); render(); toast('Demo reset complete', 'Seed data restored.')}
      document.addEventListener('click', e => {const f = e.target.closest('[data-filter]'); if (f) {const v = f.dataset.filter; if (page !== 'cases') setPage('cases'); statusFilter = v; casePage = 1; render(); return } const n = e.target.closest('[data-quick-note]'); if (n) {caseDetail(n.dataset.quickNote); noteForm(); return } const a = e.target.closest('[data-ask-ai]'); if (a) {setPage('ai'); assistantCaseId = a.dataset.askAi; render()} });
      // navigation and general actions
      document.addEventListener('click', e => {
        const nav = e.target.closest('[data-page]'); if (nav) {setPage(nav.dataset.page); return }

        const aiPrompt = e.target.closest('[data-ai-prompt]'); if (aiPrompt) {askAssistant(aiPrompt.dataset.aiPrompt); return }
        const clearAi = e.target.closest('#aiClearChat'); if (clearAi) {if (assistantCaseId) delete state.aiChats[assistantCaseId]; save(); render(); toast('Conversation cleared', 'Case data and investigation records were unchanged.'); return }
        const cbtn = e.target.closest('[data-open-case]'); if (cbtn) {caseDetail(cbtn.dataset.openCase); return }

        const ma = e.target.closest('[data-modal-action]'); if (ma) {const action = ma.dataset.modalAction; switch (action) {case 'close': closeModal(); render(); break; case 'ask-ai': {const id = selectedCase; assistantCaseId = id; closeModal(); page = 'ai'; render(); break} case 'back-detail': {const id = selectedCase; caseDetail(id); break} case 'note': noteForm(); break; case 'decision': decisionForm(); break; case 'save-note': {const txt = ($('noteText')?.value || '').trim(); if (!txt) return toast('Note is required'); const c = state.cases.find(x => x.id === selectedCase); if (!c) return; c.notes = c.notes || []; c.notes.unshift({author: 'SOC Administrator', text: txt, time: new Date().toISOString()}); audit('Investigation note added', c.id, txt); save(); caseDetail(c.id); toast('Investigation note saved'); break} case 'save-decision': {const c = state.cases.find(x => x.id === selectedCase); const verdict = $('decisionVerdict')?.value, status = $('decisionStatus')?.value, txt = ($('decisionText')?.value || '').trim(); if (!txt) return toast('Add a decision explanation', 'A recorded decision must include context.'); c.verdict = verdict; c.status = status; c.notes = c.notes || []; c.notes.unshift({author: 'SOC Administrator', text: 'Decision: ' + verdict + '. ' + txt, time: new Date().toISOString()}); c.events = c.events || []; c.events.unshift({time: new Date().toISOString(), text: 'Administrator recorded ' + verdict + ' decision'}); notify('Case decision recorded', c.id + ' · ' + verdict); audit('Administrator decision recorded', c.id, verdict + ' / ' + status + ' — ' + txt); save(); caseDetail(c.id); toast('Decision recorded', c.id + ' updated across the demo.'); break} case 'report': showReport(selectedCase); break; case 'create-case': createCase(); break;}return }
        if (e.target.closest('#uploadMain') || e.target.closest('#uploadTop') || e.target.closest('#uploadEmpty') || e.target.closest('#quickUpload')) {uploadModal(); return }
        if (e.target.closest('#chooseFile')) {$('modalFile').click(); return }

        if (e.target.id === 'modalback') closeModal();

      document.addEventListener('change', e => {if (e.target.id === 'modalFile' && e.target.files?.[0]) selectFile(e.target.files[0])});
      document.addEventListener('dragover', e => {const dz = e.target.closest('#dropzone'); if (dz) {e.preventDefault(); dz.classList.add('drag')} }); document.addEventListener('dragleave', e => {const dz = e.target.closest('#dropzone'); if (dz) dz.classList.remove('drag')}); document.addEventListener('drop', e => {const dz = e.target.closest('#dropzone'); if (dz) {e.preventDefault(); dz.classList.remove('drag'); if (e.dataTransfer.files?.[0]) selectFile(e.dataTransfer.files[0])} });

      function applyTheme(theme) {document.body.classList.toggle('light', theme === 'light'); const b = $('themeToggle'); if (b) {const light = theme === 'light'; const symbol = b.querySelector('.theme-symbol'); const label = b.querySelector('.theme-label'); if (symbol) symbol.textContent = light ? '☾' : '☼'; if (label) label.textContent = light ? 'Dark mode' : 'Light mode'; b.title = light ? 'Switch to dark mode' : 'Switch to light mode'; b.setAttribute('aria-label', b.title); b.setAttribute('aria-pressed', String(light)); document.querySelector('meta[name="theme-color"]')?.setAttribute('content', light ? '#f5f7fb' : '#0b1220')} try {localStorage.setItem(THEME_KEY, theme)} catch { } }
